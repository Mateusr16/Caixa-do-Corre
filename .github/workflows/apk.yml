name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm install

      - name: Criar projeto Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Usar a mesma assinatura em todo APK (permite atualizar sem perder dados)
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Guardar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: CaixaDoCorre-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar na aba Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk CaixaDoCorre.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest CaixaDoCorre.apk \
            --target "${{ github.sha }}" \
            --title "Caixa do Corre (APK para Android)" \
            --notes "Baixe o arquivo CaixaDoCorre.apk e instale no celular."
